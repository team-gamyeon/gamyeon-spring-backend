services:
  spring-server:
    image: zzang6535/gamyeon-spring:latest
    container_name: SPRING-SERVER
    ports:
      - "8080:8080"
    environment:
      - CONSUL_HOST=consul
    networks:
      - gamyeon-net
  prometheus:
    image: prom/prometheus
    container_name: GAMYEON_PROMETHEUS
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - ./data/prometheus:/prometheus
    networks:
      - gamyeon-net

  grafana:
    image: grafana/grafana
    container_name: GAMYEON_GRAFANA
    ports:
      - "3000:3000"
    volumes:
      - ./data/grafana:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - gamyeon-net
  postgres:
    image: postgres:16-alpine
    container_name: GAMYEON_POSTGRES
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    env_file: .env
    networks:
      - gamyeon-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gamyeon"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  gamyeon-net:
    external: true
