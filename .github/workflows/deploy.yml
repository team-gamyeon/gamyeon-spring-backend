name: CI/CD Pipeline

jobs:
  # ── Lint ──────────────────
  lint:
    name: Lint (Spotless)
    runs-on: ubuntu-latest
    if: github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop'

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: JDK 17 설정
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Gradle 캐시
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: gradlew 권한 설정
        run: chmod +x gradlew

      - name: Spotless 검사
        run: ./gradlew spotlessCheck --no-daemon

  # ── Test ──────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    if: github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop'

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: JDK 17 설정
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Gradle 캐시
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: gradlew 권한 설정
        run: chmod +x gradlew

      - name: 테스트 실행
        run: ./gradlew test --no-daemon

      - name: 테스트 결과 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/reports/tests/test/
          retention-days: 7

  # ── Deploy ─────────────────
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'

    steps:
      - name: EC2에서 빌드 + 배포
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 20m
          script: |
            set -e

            echo "=== [1/5] 소스코드 업데이트 ==="
            cd ~/gamyeon-backend
            git pull origin ${{ github.ref_name }}

            echo "=== [2/5] Spotless 포맷 적용 ==="
            chmod +x gradlew
            ./gradlew spotlessApply --no-daemon

            echo "=== [3/5] 빌드 ==="
            ./gradlew clean bootJar -x test --no-daemon

            echo "=== [4/5] Docker 이미지 빌드 + DockerHub 푸시 ==="
            docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/gamyeon-spring:latest .
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin
            docker push ${{ secrets.DOCKERHUB_USERNAME }}/gamyeon-spring:latest

            echo "=== [5/5] 새 이미지로 컨테이너 재시작 ==="
            cd ~/gamyeon
            docker compose pull spring
            docker compose up -d spring

            echo "=== 배포 완료: $(date) ==="